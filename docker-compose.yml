services:
  timesfm-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timesfm-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - MAX_CPU_THREADS=2
      - PORT=8100
      - HF_HOME=/home/appuser/.cache/huggingface
      - LOTTERY_CACHE_DIR=/app/cache
    volumes:
      - ./hf_cache:/home/appuser/.cache/huggingface
      - ./frontend:/app/frontend:ro
      - ./backend:/app/backend:ro
      # Historico oficial da Caixa: concurso sorteado e imutavel, entao o cache
      # sobrevive a deploys e evita rebuscar centenas de concursos a cada subida.
      - ./lottery_cache:/app/cache
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3500M
        reservations:
          cpus: '0.5'
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
