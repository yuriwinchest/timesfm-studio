name: Deploy TimesFM Studio to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Syntax
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/engine.py
          python -m py_compile backend/lottery_service.py
          python -m py_compile backend/ticket_scanner.py
          python -m py_compile backend/ticket_checker.py
          python -m py_compile backend/ticket_vision.py
          python -m py_compile backend/lottery_rules.py
          python -m py_compile backend/lottery_history.py
          python -m py_compile backend/mirror.py

      - name: Instalar stack optica para o teste de leitura
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libzbar0
          pip install --quiet numpy opencv-python-headless pytesseract pyzbar

      - name: Teste de fumaca - leitura de comprovante
        run: python backend/tests/smoke_scan.py

  deploy:
    name: Deploy to Hostinger VPS
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # A conexao SSH do runner com esta VPS falha de forma intermitente
      # ("dial tcp :22: i/o timeout"): 3 quedas em 8 deploys, e todas as vezes uma
      # nova tentativa imediata funcionou. Pedir re-run na mao nao e opcao - o fluxo
      # existe para nao depender de intervencao manual. Entao a pipeline retenta.
      - name: Deploy na VPS (tentativa 1)
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          script: |
            set -e
            DEPLOY_DIR="/var/www/timesfm-studio"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            if [ ! -d ".git" ]; then
              git clone https://github.com/yuriwinchest/timesfm-studio.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            bash scripts/deploy_vps.sh
      - name: Pausa antes da tentativa 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy na VPS (tentativa 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          script: |
            set -e
            DEPLOY_DIR="/var/www/timesfm-studio"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            if [ ! -d ".git" ]; then
              git clone https://github.com/yuriwinchest/timesfm-studio.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            bash scripts/deploy_vps.sh
      - name: Pausa antes da tentativa final
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120

      - name: Deploy na VPS (tentativa final)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          script: |
            set -e
            DEPLOY_DIR="/var/www/timesfm-studio"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            if [ ! -d ".git" ]; then
              git clone https://github.com/yuriwinchest/timesfm-studio.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            bash scripts/deploy_vps.sh
